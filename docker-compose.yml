version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  bastion:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      - GIN_MODE=release
    volumes:
      - ./configs/config.yaml:/app/configs/config.yaml:ro
    restart: unless-stopped
